server:
  # Puerto unico de entrada para clientes
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
        # Enruta peticiones de autenticacion al auth-service
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

        # Publica catalog-service bajo /catalog/** y remueve el prefijo /catalog
            - id: catalog-service
              uri: http://localhost:8083
              predicates:
                - Path=/catalog/**
              filters:
                - RewritePath=/catalog/(?<segment>.*), /${segment}

        # Enruta peticiones de ordenes al orders-service
            - id: orders-service
              uri: http://localhost:8082
              predicates:
                - Path=/orders/**

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,gateway
