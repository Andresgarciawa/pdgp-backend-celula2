version: '3.9'

services:
  postgres-auth:
    image: postgres:16
    container_name: auth-postgres-3
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: celula2
      POSTGRES_PASSWORD: celula2
    ports:
      - "5441:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data

volumes:
  auth_pgdata: