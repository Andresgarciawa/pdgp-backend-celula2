version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: postgres_auth
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: reto
      POSTGRES_PASSWORD: reto
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbit_auth
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: reto
      RABBITMQ_DEFAULT_PASS: reto

volumes:
  postgres_data:
